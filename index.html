<style>
:root{--bg:#050a1f;--ink:#eaf1ff;--muted:#8ea3c7;--line:rgba(126,160,255,.18);--core2:#7cc4ff;--ok:#3ddc97;--soon:#f2b640;
 --R:min(36vmin,300px);--node:clamp(46px,9vmin,78px);

html{background:var(--bg);color:var(--ink);scroll-padding-top:env(safe-area-inset-top,0px)}

a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,40px) clamp(14px,4vw,32px) 48px}
.hero{display:grid;place-items:center;padding-top:clamp(8px,3vh,28px)}
.hub{position:relative;width:calc(var(--R)*2 + var(--node) + 120px);max-width:100%;aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;width:calc(var(--R)*2);aspect-ratio:1;border-radius:50%;
 background:conic-gradient(from 0deg,#2f7bff,#22d3ee,#3ddc97,#a3e635,#f2b640,#fb7185,#e11d74,#7c3aed,#2f7bff);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
 filter:drop-shadow(0 0 10px rgba(47,123,255,.7)) drop-shadow(0 0 22px rgba(124,58,237,.35));animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
svg.links line{stroke:url(#lg);stroke-width:.35;stroke-linecap:round;opacity:.35;transition:opacity .25s,stroke-width .25s}
svg.links line.flow{stroke:#9fd2ff;stroke-dasharray:1.2 7;stroke-width:.55;opacity:0;animation:flow 2.6s linear infinite}

@keyframes flow{to{stroke-dashoffset:-16.4}}
.core{position:relative;z-index:2;width:calc(var(--R)*1.12);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;text-align:center;
 background:radial-gradient(circle at 50% 30%,#1c3d9e 0%,#0b1e5c 45%,#05103a 75%);
 box-shadow:0 0 0 2px rgba(124,196,255,.55),0 0 40px rgba(47,123,255,.65),inset 0 0 50px rgba(47,123,255,.45),inset 0 -14px 40px rgba(0,0,0,.6)}
.core::after{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.mark{width:58%;height:auto;display:block}
.word{font-family:Syncopate,"Arial Black",sans-serif;font-weight:700;letter-spacing:.14em;font-size:calc(var(--R)*.105);margin:2% 0 0;color:#e8eeff;
 text-shadow:0 1px 0 #9aa9cf,0 2px 0 #6c7aa3,0 0 18px rgba(124,196,255,.55);direction:ltr}
.cap{margin:3% 12% 0;font-size:calc(var(--R)*.048);color:var(--core2);min-height:1.4em;line-height:1.4}
.cap b{color:var(--ink);font-weight:700}
.node{position:absolute;top:50%;left:50%;z-index:3;width:var(--node);height:var(--node);margin:calc(var(--node)/-2) 0 0 calc(var(--node)/-2);
 transform:rotate(var(--a)) translate(var(--R)) rotate(calc(-1*var(--a)));border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;cursor:pointer;border:0;padding:0;font:inherit;
 background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),transparent 38%),radial-gradient(circle at 50% 60%,var(--c1),var(--c2));
 box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 18px var(--c1),0 0 38px color-mix(in srgb,var(--c1) 55%,transparent);transition:box-shadow .2s,filter .2s}
.node svg{width:46%;height:46%;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.node .lb{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
.node .lb small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);text-align:center}
.node:hover,.node:focus-visible,.node.on{filter:brightness(1.15);box-shadow:0 0 0 3px #fff,0 0 26px var(--c1),0 0 60px var(--c1)}
.node:focus-visible{outline:none}
.node .st{position:absolute;top:-2px;inset-inline-end:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);background:var(--soon)}
.node.live .st{background:var(--ok)}
.layer{text-align:center;margin:clamp(6px,2vh,18px) auto 0;max-width:560px}
.layer svg{width:34px;height:34px;stroke:var(--ok);fill:none;stroke-width:1.8}

.stack{margin:6px 0 0;color:var(--muted);font-size:12.5px;direction:ltr}
.list{margin:clamp(28px,6vh,56px) auto 0;max-width:980px;border-top:1px solid var(--line);padding-top:22px}
.list h3{margin:0 0 4px;font-size:18px}
.list>p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 40px;margin:0;padding:0;list-style:none}
.mods li{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.mods .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,var(--c1),var(--c2));box-shadow:0 0 14px color-mix(in srgb,var(--c1) 60%,transparent)}
.mods .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mods b{display:block;font-size:15px}.mods small{color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap;text-decoration:none}
.pill.live{background:rgba(61,220,151,.14);color:var(--ok);border:1px solid rgba(61,220,151,.4)}
.pill.live:hover,.pill.live:focus-visible{background:rgba(61,220,151,.26);outline:2px solid var(--ok);outline-offset:2px}
.pill.soon{color:var(--soon);border:1px solid rgba(242,182,64,.35)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;direction:ltr}
@media (max-width:640px){:root{--R:34vw;--node:42px}.hub{width:calc(var(--R)*2 + var(--node) + 18px)}.node .lb{display:none}.mods{grid-template-columns:1fr}.core{width:calc(var(--R)*1.22)}.word{font-size:calc(var(--R)*.13)}.cap{font-size:12px}}
@media (prefers-reduced-motion:reduce){.ring,svg.links line.flow{animation:none}.node{transition:none}}
