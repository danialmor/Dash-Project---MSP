<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b1a1e">
<title>danimor</title>
<style>
:root{--bg:#0b1a1e;--ink:#eaf3f1;--lime:#a6d63a;--teal:#2fb7a6;--dim:#7f9a98}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;color:var(--ink);font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;position:relative}
.glow{position:fixed;inset:-20%;background:radial-gradient(40% 40% at 30% 30%,rgba(47,183,166,.20),transparent 70%),radial-gradient(35% 35% at 75% 70%,rgba(166,214,58,.13),transparent 70%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent 75%);mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent 75%);opacity:0;animation:fade 2s .4s forwards}
main{position:relative;display:grid;justify-items:center;gap:clamp(18px,3.4vh,32px);padding:24px}
svg{width:clamp(132px,22vmin,210px);height:auto;overflow:visible}
.frame{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.7s cubic-bezier(.6,.05,.2,1) .2s forwards}
.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:rise .9s cubic-bezier(.2,.9,.25,1.05) forwards}
.b1{fill:var(--teal);animation-delay:1.35s}.b2{fill:var(--lime);animation-delay:1.55s}.b3{fill:var(--ink);animation-delay:1.75s}
.arm{fill:none;stroke:var(--lime);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .9s ease-out 2.2s forwards}
.hook{stroke:var(--lime);stroke-width:2;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:50% 0;animation:fade .4s 3s forwards,swing 3.6s ease-in-out 3.4s infinite alternate}
.dot{fill:var(--lime);opacity:0;animation:fade .4s 3s forwards,pulse 2.6s ease-in-out 3.4s infinite}
.word{display:flex;direction:ltr;gap:.34em;font-weight:300;font-size:clamp(20px,4.2vmin,34px);letter-spacing:.34em;text-transform:uppercase;padding-left:.34em}
.word span{opacity:0;transform:translateY(14px);filter:blur(6px);animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards}
.rule{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--dim),transparent);animation:rule 1.4s cubic-bezier(.2,.8,.2,1) 3.3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{to{transform:scaleY(1)}}@keyframes fade{to{opacity:1}}
@keyframes letter{to{opacity:1;transform:none;filter:none}}@keyframes rule{to{width:min(260px,52vw)}}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.glow{animation:none}}
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<main role="img" aria-label="danimor">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <rect class="frame" x="14" y="14" width="172" height="172" rx="40"/>
    <rect class="bar b1" x="52" y="98" width="22" height="58" rx="5"/>
    <rect class="bar b2" x="89" y="72" width="22" height="84" rx="5"/>
    <rect class="bar b3" x="126" y="112" width="22" height="44" rx="5"/>
    <path class="arm" d="M44 62 L150 62 L150 50"/>
    <line class="hook" x1="130" y1="62" x2="130" y2="84"/>
    <circle class="dot" cx="130" cy="89" r="4.2"/>
  </svg>
  <div class="word" id="w" aria-hidden="true"></div>
  <div class="rule"></div>
</main>
<script>
(function(){var w=document.getElementById('w'),t='DANIMOR';for(var i=0;i<t.length;i++){var s=document.createElement('span');s.textContent=t[i];s.style.animationDelay=(2.5+i*.11)+'s';w.appendChild(s)}})();
</script>
</body>
</html>
