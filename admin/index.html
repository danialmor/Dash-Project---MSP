<body>
<!-- ── ورود ── -->
<div class="page page-center" id="login" hidden>
 <div class="container container-tight py-4">
  <div class="text-center mb-4"><img class="login-emb" data-emb alt=""><div class="h2 mt-3 mb-0 brand-name">TSUBA</div><div class="text-secondary">اکوسیستم دوازده پلتفرم</div></div>
  <div class="card card-md">
   <form class="card-body" id="lf" autocomplete="on" novalidate>
    <h2 class="h2 text-center mb-2">ورود</h2>
    <p class="text-secondary text-center mb-4">با یک حساب به همه‌ی بخش‌هایی که اشتراکش را دارید وارد می‌شوید.</p>
    <div class="mb-3"><label class="form-label" for="lfCode">نام کاربری یا کد اختصاصی</label><input id="lfCode" name="code" class="form-control ltr" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="mb-2"><label class="form-label" for="lfPin">رمز عبور</label>
     <div class="input-group input-group-flat"><input id="lfPin" name="pin" type="password" class="form-control ltr" autocomplete="current-password" required><span class="input-group-text"><button type="button" class="btn btn-link link-secondary p-0" id="pwT" aria-pressed="false">نمایش</button></span></div></div>
    <label class="form-check mb-3"><input type="checkbox" class="form-check-input" name="remember" checked><span class="form-check-label">مرا روی این دستگاه به خاطر بسپار (تا ۳۰ روز)</span></label>
    <div class="text-danger small mb-2" id="lErr" role="alert"></div>
    <button class="btn btn-primary w-100 p" type="submit">ورود</button>
    <button class="btn w-100 mt-2" type="button" id="suOpen">درخواست اشتراک</button>
    <div class="text-warning small text-center mt-3" id="tmNote" hidden>حالت آزمایشی سرور روشن است.</div>
   </form>
  </div>
  <div class="text-center text-secondary mt-3"><a href="/" class="link-secondary">بازگشت به صفحه‌ی اصلی</a></div>
 </div>
</div>

<!-- ── تغییر رمز اجباری ── -->
<div class="page page-center" id="pwc" hidden>
 <div class="container container-tight py-4"><div class="card card-md"><form class="card-body" id="pcf">
  <h2 class="h2 mb-2">رمز تازه انتخاب کنید</h2><p class="text-secondary">رمز اولیه باید عوض شود. دست‌کم ۸ نویسه.</p>
  <div class="mb-3"><label class="form-label">رمز فعلی</label><input name="old" type="password" class="form-control ltr" autocomplete="current-password" required></div>
  <div class="mb-3"><label class="form-label">رمز تازه</label><input name="new" type="password" class="form-control ltr" autocomplete="new-password" minlength="8" required></div>
  <div class="text-danger small mb-2" id="pcErr" role="alert"></div>
  <button class="btn btn-primary w-100">ذخیره‌ی رمز</button>
 </form></div></div>
</div>

<!-- ── پنل ── -->
<div class="page" id="app" hidden>
 <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
  <div class="container-fluid">
   <button class="navbar-toggler" type="button" id="tog" aria-controls="menu" aria-expanded="false" aria-label="باز و بسته کردن فهرست"><span class="navbar-toggler-icon"></span></button>
   <a class="navbar-brand d-flex align-items-center gap-2" href="/" aria-label="TSUBA"><img class="emb" data-emb alt=""><span class="brand-name">TSUBA</span></a>
   <div class="navbar-collapse" id="menu">
    <div class="text-secondary small px-3 mt-2" id="scope"></div>
    <ul class="navbar-nav pt-lg-2" id="nav"></ul>
    <div class="me-box mt-auto p-3 small" id="me"></div>
   </div>
  </div>
 </aside>
 <div class="page-wrapper">
  <div class="page-header d-print-none"><div class="container-xl"><div class="row g-2 align-items-center">
   <div class="col"><div class="page-pretitle" id="pre"></div><h2 class="page-title" id="ttl"></h2></div>
   <div class="col-auto ms-auto d-flex gap-2" id="act"></div>
  </div></div></div>
  <div class="page-body"><div class="container-xl" id="pg"></div></div>
 </div>
</div>

<dialog id="dlg" aria-modal="true"></dialog>
<div class="toastx" id="toast" role="status" hidden><div class="alert alert-info mb-0" id="toastT"></div></div>
<img id="emb" src="../assets/tsuba-emblem.webp" alt="" hidden>

<script>
(function(){
'use strict';
var API='/api/v1',T='',S=null,MODS=[],VIEW='';
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(m,p,b){return fetch(API+p,{method:m,headers:Object.assign({'Content-Type':'application/json'},T?{Authorization:'Bearer '+T}:{}),body:b===undefined?undefined:JSON.stringify(b),cache:'no-store'}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||('http-'+r.status));e.status=r.status;e.body=j;throw e}return j})})}
var ERR={'bad-credentials':'نام کاربری یا رمز درست نیست.','locked':'به‌خاطر تلاش‌های ناموفق، ۱۰ دقیقه صبر کنید.','subscription-inactive':'اشتراک شما فعال نیست؛ با مدیر اشتراک تماس بگیرید.','code-exists':'این نام کاربری قبلاً گرفته شده است.','no-seats':'ظرفیت کاربران این اشتراک پر است.','level-out-of-range':'این سطح در اشتراک شما تعریف نشده است.','weak-pin':'رمز ضعیف است؛ دست‌کم ۸ نویسه و غیر از رمز قبلی.','invalid':'برخی فیلدها درست پر نشده‌اند.','no-modules':'دست‌کم یک بخش را انتخاب کنید.','owner-locked':'مدیر اشتراک را نمی‌شود غیرفعال یا جابه‌جا کرد.','forbidden':'اجازه‌ی این کار را ندارید.','rate-limited':'درخواست‌ها زیاد بود؛ کمی بعد دوباره تلاش کنید.'};
function emsg(e){return ERR[e&&e.message]||(e&&e.status?'خطای سرور ('+e.message+')':'ارتباط با سرور برقرار نشد.')}
function toast(t){$('#toastT').textContent=t;$('#toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){$('#toast').hidden=true},3200)}
var fmtD=function(ts){if(!ts)return 'نامحدود';try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts*1000))}catch(e){return new Date(ts*1000).toLocaleDateString()}};
var daysLeft=function(ts){return ts?Math.ceil((ts*1000-Date.now())/864e5):null};
var fa=function(n){return Number(n||0).toLocaleString('fa-IR')};
function modName(slug){var m=MODS.filter(function(x){return x.slug===slug})[0];return m?m.name_fa:slug}
function badge(t,c){return '<span class="badge bg-'+(c||'secondary')+'-lt">'+t+'</span>'}
function chipsMods(list){return '<div class="chips">'+((list||[]).map(function(s){return badge(esc(modName(s)),'azure')}).join('')||badge('بدون بخش','yellow'))+'</div>'}
function stChip(active,status){return active?badge('فعال','green'):(status==='suspended'?badge('معلق','red'):badge('غیرفعال یا منقضی','yellow'))}
function show(id){['login','pwc','app'].forEach(function(x){$('#'+x).hidden=x!==id})}
function card(inner,title,cls){return '<div class="card '+(cls||'')+'">'+(title?'<div class="card-header"><h3 class="card-title">'+title+'</h3></div>':'')+inner+'</div>'}
function kpis(list){return '<div class="row row-cards mb-3">'+list.map(function(k){return '<div class="col-sm-6 col-lg-3"><div class="card card-sm kpi"><div class="card-body"><div class="subheader">'+k[0]+'</div><div class="h1 mb-0 mt-1">'+k[1]+'</div>'+(k[2]||'')+'</div></div></div>'}).join('')+'</div>'}
function table(head,rows,empty){return rows.length?'<div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div></div>':'<div class="card"><div class="card-body text-center text-secondary py-5">'+empty+'</div></div>'}

/* ── ورود ── */
var lf=$('#lf');
$('#pwT').onclick=function(){var i=lf.pin,on=i.type==='password';i.type=on?'text':'password';this.textContent=on?'پنهان':'نمایش';this.setAttribute('aria-pressed',on)};
lf.onsubmit=function(e){e.preventDefault();var b=lf.querySelector('.btn.p');$('#lErr').textContent='';if(!lf.code.value.trim()||!lf.pin.value){$('#lErr').textContent='نام کاربری و رمز را وارد کنید.';return}b.disabled=true;
 api('POST','/auth/login',{code:lf.code.value.trim(),pin:lf.pin.value,device:'panel',remember:lf.remember.checked}).then(function(r){T=r.token;try{localStorage.setItem('hub.token',T)}catch(x){}lf.pin.value='';enter(r)}).catch(function(x){$('#lErr').textContent=emsg(x)}).then(function(){b.disabled=false})};
$('#suOpen').onclick=function(){openDlg('درخواست اشتراک','<p class="text-secondary">اطلاعات تماس را بگذارید؛ برای راه‌اندازی اشتراک با شما تماس گرفته می‌شود.</p><div class="mb-3"><label class="form-label">نام و نام خانوادگی</label><input name="name" class="form-control" required></div><div class="mb-3"><label class="form-label">نام شرکت</label><input name="company" class="form-control"></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">تلفن همراه</label><input name="phone" class="form-control ltr" inputmode="tel"></div><div class="col-md-6 mb-3"><label class="form-label">ایمیل</label><input name="email" type="email" class="form-control ltr"></div></div><div class="mb-1"><label class="form-label">توضیح (بخش‌های مورد نیاز، تعداد کاربر)</label><textarea name="note" rows="3" class="form-control"></textarea></div>','ارسال درخواست',function(f){
 return api('POST','/signup',{name:f.name.value,company:f.company.value,phone:f.phone.value,email:f.email.value,note:f.note.value}).then(function(){closeDlg();toast('درخواست شما ثبت شد.')})})};
$('#pcf').onsubmit=function(e){e.preventDefault();var f=e.target;api('POST','/auth/change-pin',{old:f.old.value,new:f.new.value}).then(function(r){T=r.token;try{localStorage.setItem('hub.token',T)}catch(x){}f.reset();return api('GET','/me')}).then(enter).catch(function(x){$('#pcErr').textContent=emsg(x)})};
function logout(){try{localStorage.removeItem('hub.token')}catch(e){}T='';S=null;lf.reset();show('login');lf.code.focus()}

/* ── بعد از ورود: هر کس به جای خودش ── */
function enter(s){S=s;if(s.must_change){show('pwc');return}
 if(!s.panel){location.replace(s.home||'/');return}
 api('GET','/modules').then(function(r){MODS=r.modules}).catch(function(){}).then(function(){show('app');buildNav();go(location.hash.slice(1)||'overview')})}
var NAV_ADMIN=[['overview','نمای کلی'],['tenants','اشتراک‌ها'],['signups','درخواست‌ها'],['modules','ماژول‌ها'],['staff','کاربران دفتر مرکزی'],['system','سیستم'],['profile','پروفایل من']];
var NAV_OWNER=[['overview','نمای کلی'],['users','کاربران'],['levels','سطوح'],['profile','پروفایل من']];
function isAdmin(){return S&&S.user.role==='admin'&&!S.tenant}
function buildNav(){var n=isAdmin()?NAV_ADMIN:NAV_OWNER;
 $('#scope').textContent=isAdmin()?'مدیریت اکوسیستم':S.tenant.name;
 $('#nav').innerHTML=n.map(function(x){return '<li class="nav-item"><a class="nav-link" href="#'+x[0]+'" data-go="'+x[0]+'"><span class="nav-link-title">'+x[1]+'</span></a></li>'}).join('');
 $('#me').innerHTML='<div class="fw-bold">'+esc(S.user.name)+'</div><div class="mono text-secondary">'+esc(S.ucode||S.user.code)+'</div><div class="d-flex gap-2 mt-2"><a class="btn btn-sm" href="/">صفحه‌ی اصلی</a><button class="btn btn-sm" type="button" id="lo">خروج</button></div>';
 $('#lo').onclick=logout}
$('#nav').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go);$('#menu').classList.remove('show');$('#tog').setAttribute('aria-expanded','false')}});
$('#tog').onclick=function(){var m=$('#menu'),on=!m.classList.contains('show');m.classList.toggle('show',on);this.setAttribute('aria-expanded',on)};
addEventListener('hashchange',function(){if(S&&!$('#app').hidden)go(location.hash.slice(1)||'overview',true)});
function go(v,fromHash){var list=isAdmin()?NAV_ADMIN:NAV_OWNER;if(!list.some(function(x){return x[0]===v}))v='overview';VIEW=v;if(!fromHash&&location.hash!=='#'+v)history.replaceState(null,'','#'+v);
 $$('#nav [data-go]').forEach(function(b){var on=b.dataset.go===v;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 head(list.filter(function(x){return x[0]===v})[0][1],'');$('#pg').innerHTML='<div class="text-secondary py-4">در حال بارگذاری…</div>';(isAdmin()?A:O)[v]().catch(function(x){$('#pg').innerHTML='<div class="alert alert-danger">'+esc(emsg(x))+'</div>'})}
function head(t,pre,act){$('#ttl').innerHTML=t;$('#pre').innerHTML=pre||'';$('#act').innerHTML=act||''}
/* پنجره: عنوان، بدنه، دکمه‌ی اصلی و کار ذخیره (یک Promise برمی‌گرداند) */
function openDlg(title,body,okText,onOk){var d=$('#dlg');
 d.innerHTML='<form class="modal-content"><div class="modal-header"><h5 class="modal-title">'+title+'</h5><button type="button" class="btn-close" data-close aria-label="بستن"></button></div><div class="modal-body">'+body+'<div class="text-danger small mt-2 err" role="alert"></div></div><div class="modal-footer">'+(okText?'<button class="btn btn-primary p">'+okText+'</button>':'')+'<button type="button" class="btn" data-close>'+(okText?'انصراف':'بستن')+'</button></div></form>';
 var f=d.querySelector('form');d.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeDlg});
 f.onsubmit=function(e){e.preventDefault();if(!onOk)return closeDlg();var b=f.querySelector('.btn.p');b.disabled=true;f.querySelector('.err').textContent='';Promise.resolve(onOk(f)).catch(function(x){f.querySelector('.err').textContent=x&&x.ui?x.ui:emsg(x)}).then(function(){if(b)b.disabled=false})};
 d.showModal?d.showModal():d.setAttribute('open','');return f}
function closeDlg(){var d=$('#dlg');d.close?d.close():d.removeAttribute('open')}
function doneDlg(title,html,after){var d=$('#dlg');d.innerHTML='<div class="modal-content"><div class="modal-header"><h5 class="modal-title">'+title+'</h5></div><div class="modal-body">'+html+'</div><div class="modal-footer"><button type="button" class="btn btn-primary" data-close>بستن</button></div></div>';d.querySelector('[data-close]').onclick=function(){closeDlg();if(after)after()}}
function modChecks(name,allowed,picked){return '<div>'+MODS.filter(function(m){return !allowed||allowed.indexOf(m.slug)>=0}).map(function(m){return '<label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="'+name+'" value="'+m.slug+'"'+(picked&&picked.indexOf(m.slug)>=0?' checked':'')+'><span class="form-check-label">'+esc(m.name_fa)+(m.status==='planned'?' <small class="text-warning">(به‌زودی)</small>':'')+'</span></label>'}).join('')+'</div>'}
function picked(f,name){return $$('input[name="'+name+'"]:checked',f).map(function(i){return i.value})}
function secretBox(rows){return '<div class="alert alert-success secret mb-0">'+rows.map(function(r){return '<div class="d-flex justify-content-between gap-3 py-1"><span>'+r[0]+'</span><b class="mono">'+esc(r[1])+'</b></div>'}).join('')+'<div class="small text-secondary mt-2">این اطلاعات را به کاربر بدهید. با اولین ورود، رمز اولیه باید عوض شود.</div></div>'}
function fld(label,input,col){return '<div class="'+(col||'col-12')+' mb-3"><label class="form-label">'+label+'</label>'+input+'</div>'}

/* ── مدیر اکوسیستم ── */
var A={
 overview:function(){return Promise.all([api('GET','/admin/tenants'),api('GET','/admin/stats'),api('GET','/admin/signups')]).then(function(r){var t=r[0].tenants,st=r[1],su=r[2].items;
  var act=t.filter(function(x){return x.active}).length,exp=t.filter(function(x){var d=x.sub&&daysLeft(x.sub.ends);return x.active&&d!==null&&d<=30}).length,seats=t.reduce(function(a,x){return a+x.users},0),nw=su.filter(function(x){return x.status==='new'}).length;
  head('نمای کلی اکوسیستم','TSUBA');
  $('#pg').innerHTML=kpis([['اشتراک فعال',fa(act)+' از '+fa(t.length)],['نزدیک پایان (۳۰ روز)',fa(exp)],['کاربران اشتراک‌ها',fa(seats)],['درخواست تازه',fa(nw)]])+kpis([['کاربران دفتر مرکزی',fa(st.users)],['حجم پایگاه‌داده',fa(st.db_kb)+' KB'],['ورود ۲۴ ساعت',fa(st.logins24h)],['آخرین پشتیبان',st.last_backup?fmtD(st.last_backup):'هنوز ندارد']])+
