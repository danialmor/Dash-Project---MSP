<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>مرکز کنترل</title>
<style>
:root{--bg:#eef3f1;--card:rgba(255,255,255,.72);--ink:#14232a;--ink2:#566a70;--line:rgba(20,35,42,.12);--pri:#14323a;--onp:#fff;--ok:#1f8a5b;--warn:#c98a10;--bad:#c23a3a;--lime:#8fbf1f;--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(60% 50% at 15% 0,rgba(47,183,166,.22),transparent 70%),radial-gradient(50% 45% at 100% 100%,rgba(166,214,58,.2),transparent 70%),var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
button,input,select{font:inherit;color:inherit}.hide{display:none!important}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(20,35,42,.07)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{width:min(380px,100%);padding:26px;display:grid;gap:12px}
.login h1{margin:0 0 4px;font-size:20px}.login p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.9}
label{display:grid;gap:5px;font-size:12.5px;color:var(--ink2)}input,select{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:12px;padding:10px 12px;min-height:42px;width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
.btn{border:0;background:var(--pri);color:var(--onp);border-radius:12px;padding:10px 16px;min-height:42px;cursor:pointer;font-weight:600}.btn.sm{min-height:34px;padding:6px 12px;font-size:12.5px}.btn.lt{background:rgba(20,35,42,.08);color:var(--ink)}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;flex-wrap:wrap}header b{font-size:17px}header small{color:var(--ink2)}header .sp{flex:1}
nav{display:flex;gap:6px;padding:0 22px 10px;overflow:auto}nav button{border:0;background:rgba(20,35,42,.06);padding:9px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--ink2)}nav button[aria-selected=true]{background:var(--pri);color:var(--onp)}
main{padding:6px 22px 40px;display:grid;gap:14px}.sec{padding:18px}.sec h2{margin:0 0 12px;font-size:15.5px}.sec h3{margin:14px 0 8px;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{padding:14px 16px}.stat b{display:block;font-size:26px;line-height:1.2}.stat small{color:var(--ink2)}.stat.bad b{color:var(--bad)}.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}
.banner{padding:12px 16px;border-radius:14px;font-weight:600}.banner.ok{background:rgba(31,138,91,.12);color:var(--ok)}.banner.warn{background:rgba(201,138,16,.14);color:#8a5d00}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--ink2);font-weight:600;font-size:12px}.tw{overflow:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:rgba(20,35,42,.08);font-size:11.5px;margin:1px 2px}.chip.ok{background:rgba(31,138,91,.14);color:var(--ok)}.chip.off{background:rgba(194,58,58,.13);color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(10,20,24,.45);display:grid;place-items:center;padding:16px;z-index:50}.modal>div{width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px}
.secret{background:#10252a;color:#d7f06e;border-radius:12px;padding:12px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;margin:8px 0}
.mono{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:embed}.muted{color:var(--ink2)}
@media(max-width:600px){header,nav,main{padding-inline:12px}}
</style>
</head>
<body>
<section class="login" id="login"><form class="card" id="lf"><h1>مرکز کنترل</h1><p>ورود فقط برای مدیر سیستم. کد کاربری و رمز را وارد کنید.</p>
<label>کد کاربری<input id="lc" autocomplete="username" autocapitalize="off" required></label><label>رمز<input id="lp" type="password" autocomplete="current-password" required></label>
<div class="err" id="le" role="alert"></div><button class="btn" id="lb">ورود</button></form></section>

<div id="app" class="hide">
<header><b>مرکز کنترل</b><small id="who"></small><span class="sp"></span><span id="net" class="chip"></span><button class="btn lt sm" id="out">خروج</button></header>
<nav role="tablist" id="nav"></nav><main id="main"></main></div>
<div id="md" class="modal hide" role="dialog" aria-modal="true"><div class="card" id="mdc"></div></div>

<script src="../shared/sdk.js"></script>
<script>
var $=function(s,r){return(r||document).querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var H=new HubSDK({site:'admin'}),TAB='overview',SITES=[],ROLES={admin:'مدیر کل',manager:'مدیر',member:'عضو',viewer:'فقط‌مشاهده',service:'سرویس'};
var TABS=[['overview','نمای کلی'],['sites','سایت‌ها'],['users','کاربران و کد‌ها'],['sync','همگام‌سازی'],['audit','رویدادها'],['connect','اتصال و هوش مصنوعی'],['backup','پشتیبان']];
var api=function(m,p,b){return H.api(m,'/admin'+p,b)};
function ago(t){if(!t)return '—';var s=Math.max(0,Date.now()/1e3-t);if(s<60)return 'همین حالا';if(s<3600)return Math.floor(s/60)+' دقیقه پیش';if(s<86400)return Math.floor(s/3600)+' ساعت پیش';return Math.floor(s/86400)+' روز پیش'}
function fdt(t){return t?new Date(t*1e3).toLocaleString('fa-IR'):'—'}
function modal(h){$('#mdc').innerHTML=h;$('#md').classList.remove('hide');var f=$('#mdc input,#mdc button');f&&f.focus()}function closeM(){$('#md').classList.add('hide')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});$('#md').addEventListener('click',function(e){if(e.target.id==='md')closeM()});
function secretBox(title,lines){modal('<h2 style="margin:0 0 6px">'+esc(title)+'</h2><p class="muted" style="margin:0 0 8px">این مقدار فقط همین یک‌بار نمایش داده می‌شود. همین حالا یادداشت یا کپی کنید.</p>'+lines.map(function(l){return '<div class="muted" style="font-size:12px">'+esc(l[0])+'</div><div class="secret" data-copy="'+esc(l[1])+'">'+esc(l[1])+'</div>'}).join('')+'<div class="row"><button class="btn lt" data-a="copyall">کپی همه</button><button class="btn" data-a="close">متوجه شدم</button></div>');window._sec=lines.map(function(l){return l[0]+': '+l[1]}).join('\n')}
function toast(t){var d=document.createElement('div');d.textContent=t;d.setAttribute('role','status');d.style.cssText='position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#14323a;color:#fff;padding:10px 18px;border-radius:99px;z-index:99';document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}

$('#lf').addEventListener('submit',function(e){e.preventDefault();$('#le').textContent='';$('#lb').disabled=true;H.login($('#lc').value.trim(),$('#lp').value).then(function(r){if(r.user.role!=='admin'){H.logout(true);throw{message:'only-admin'}}start()},function(x){$('#le').textContent=x.status===429?'تلاش‌های ناموفق زیاد بود؛ ۱۰ دقیقه بعد دوباره تلاش کنید.':x.message==='only-admin'?'این حساب مدیر کل نیست.':x.offline?'اتصال به سرور برقرار نیست.':'کد یا رمز درست نیست.'}).then(function(){$('#lb').disabled=false})});
function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=H.user.name+' · '+H.user.code;$('#nav').innerHTML=TABS.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===TAB)+'">'+t[1]+'</button>'}).join('');show(TAB)}
function net(){var s=H.status();var n=$('#net');if(n){n.textContent=s.online?'آنلاین':'آفلاین';n.className='chip '+(s.online?'ok':'off')}}H.on('status',net);setInterval(net,2000);
$('#out').addEventListener('click',function(){H.logout(true).then(function(){location.reload()})});
H.on('auth',function(){location.reload()});
H.me().then(function(r){if(r.user.role==='admin'){H.user=r.user;start()}},function(){});
$('#nav').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;TAB=b.dataset.t;[].forEach.call($('#nav').children,function(x){x.setAttribute('aria-selected',x===b)});show(TAB)});
function show(t){var m=$('#main');m.innerHTML='<div class="card sec muted">در حال بارگذاری…</div>';(V[t]||V.overview)().then(function(h){m.innerHTML=h},function(e){m.innerHTML='<div class="card sec"><div class="err">'+(e.offline?'اتصال به سرور برقرار نیست.':'خطا: '+esc(e.message))+'</div></div>'})}
function reload(){show(TAB)}

var V={
overview:function(){return api('GET','/stats').then(function(s){var okAll=!s.pending&&!s.conflicts,st=function(v,l,c){return '<div class="card stat '+(c||'')+'"><b>'+esc(v)+'</b><small>'+l+'</small></div>'};
 return '<div class="banner '+(okAll?'ok':'warn')+'">'+(okAll?'همه‌چیز همگام است؛ هیچ تغییر ارسال‌نشده یا تعارضی گزارش نشده.':'توجه: '+s.pending+' تغییر ارسال‌نشده و '+s.conflicts+' تعارض در دستگاه‌ها گزارش شده (برگه‌ی همگام‌سازی).')+'</div>'
 +'<div class="stats">'+st(s.users,'کاربر فعال')+st(s.sites,'سایت ثبت‌شده')+st(s.records,'رکورد ذخیره‌شده')+st(s.changes24h,'تغییر در ۲۴ ساعت')+st(s.logins24h,'ورود در ۲۴ ساعت')+st(s.failed24h,'ورود ناموفق ۲۴ ساعت',s.failed24h>5?'bad':'')+st(s.pending,'تغییر در صف دستگاه‌ها',s.pending?'warn':'ok')+st(s.conflicts,'تعارض باز',s.conflicts?'bad':'ok')+'</div>'
 +'<div class="card sec"><h2>سرور</h2><div class="row"><span class="chip">نسخه‌ی هاب '+esc(s.version)+'</span><span class="chip">حجم پایگاه‌داده '+s.db_kb+' KB</span><span class="chip '+(s.last_backup?'ok':'off')+'">آخرین پشتیبان: '+ago(s.last_backup)+'</span><span class="chip '+(s.ai?'ok':'')+'">هوش مصنوعی: '+(s.ai?'فعال':'تنظیم نشده')+'</span></div></div>'})},
sites:function(){return api('GET','/sites').then(function(r){SITES=r.sites;return '<div class="card sec"><h2>سایت‌های ثبت‌شده روی این دامین</h2><div class="tw"><table><thead><tr><th>شناسه</th><th>عنوان</th><th>آدرس</th><th>نوع</th><th>وضعیت</th><th></th></tr></thead><tbody>'
 +r.sites.map(function(s){return '<tr><td class="mono">'+esc(s.slug)+'</td><td>'+esc(s.title)+'</td><td class="mono">'+esc(location.origin+s.path)+'</td><td>'+esc(s.kind)+'</td><td><span class="chip '+(s.active?'ok':'off')+'">'+(s.active?'فعال':'غیرفعال')+'</span></td><td><button class="btn lt sm" data-a="site-toggle" data-s="'+esc(s.slug)+'">'+(s.active?'غیرفعال کن':'فعال کن')+'</button></td></tr>'}).join('')
 +'</tbody></table></div><h3>افزودن سایت جدید</h3><form class="form" id="fs"><label>شناسه (انگلیسی کوچک)<input name="slug" required pattern="[a-z0-9][a-z0-9_-]{1,40}" placeholder="مثلاً crm"></label><label>عنوان<input name="title" required></label><label>مسیر<input name="path" placeholder="/crm/" class="mono"></label><label>نوع<select name="kind"><option value="app">برنامه</option><option value="system">سیستمی</option></select></label><button class="btn">ثبت</button></form>'
 +'<p class="muted" style="font-size:12px;line-height:1.9">ثبت سایت در اینجا فقط «شناسنامه و دسترسی» می‌سازد. پوشه‌ی سایت را در مخزن گیت‌هاب با همان نام بگذارید تا خودکار روی هاست بیاید.</p></div>'})},
users:function(){return Promise.all([api('GET','/users'),api('GET','/sites')]).then(function(a){SITES=a[1].sites;var us=a[0].users;
 return '<div class="card sec"><h2>کاربران و کدهایشان</h2><div class="tw"><table><thead><tr><th>کد</th><th>نام</th><th>نقش</th><th>دسترسی به سایت‌ها</th><th>آخرین ورود</th><th></th></tr></thead><tbody>'+us.map(function(u){return '<tr><td class="mono"><b>'+esc(u.code)+'</b></td><td>'+esc(u.name)+(u.active?'':' <span class="chip off">غیرفعال</span>')+'</td><td>'+esc(ROLES[u.role]||u.role)+'</td><td>'+(u.role==='admin'?'<span class="chip">همه</span>':Object.keys(u.grants).map(function(s){return '<span class="chip">'+esc(s)+' · '+esc(ROLES[u.grants[s]]||u.grants[s])+'</span>'}).join('')||'<span class="muted">—</span>')+'</td><td>'+ago(u.last_login)+'</td><td class="row">'+(u.role==='service'?'':'<button class="btn lt sm" data-a="user-edit" data-u="'+u.id+'">ویرایش</button><button class="btn lt sm" data-a="user-pin" data-u="'+u.id+'">رمز جدید</button>')+'<button class="btn lt sm" data-a="user-toggle" data-u="'+u.id+'" data-on="'+(u.active?1:0)+'">'+(u.active?'غیرفعال':'فعال')+'</button></td></tr>'}).join('')+'</tbody></table></div>'
 +'<h3>افزودن کاربر</h3><form class="form" id="fu"><label>کد (یکتا)<input name="code" required pattern="[A-Za-z0-9_.-]{2,24}" class="mono" placeholder="مثلاً D101"></label><label>نام<input name="name" required></label><label>نقش<select name="role"><option value="member">عضو</option><option value="manager">مدیر</option><option value="viewer">فقط‌مشاهده</option></select></label><label>رمز (خالی = تصادفی)<input name="pin" class="mono" inputmode="numeric"></label></form>'
 +'<div class="row" style="margin:8px 0">'+SITES.filter(function(s){return s.active}).map(function(s){return '<label style="display:flex;gap:6px;align-items:center;flex-direction:row"><input type="checkbox" form="fu" name="g_'+esc(s.slug)+'" style="width:auto;min-height:0"> '+esc(s.title)+'</label>'}).join('')+'</div><button class="btn" form="fu">ایجاد کاربر</button></div>'})},
sync:function(){return api('GET','/clients').then(function(r){return '<div class="card sec"><h2>دستگاه‌ها و وضعیت همگام‌سازی</h2><p class="muted" style="margin-top:0;font-size:12.5px">هر دستگاه هنگام ارتباط با سرور تعداد تغییرات ارسال‌نشده‌اش را گزارش می‌دهد. عدد «در صف» یعنی آن دستگاه آفلاین کار کرده و منتظر اتصال است.</p><div class="tw"><table><thead><tr><th>دستگاه</th><th>کاربر</th><th>آخرین ارتباط</th><th>در صف</th><th>تعارض</th><th>مرورگر</th></tr></thead><tbody>'+(r.items.map(function(c){var stale=Date.now()/1e3-c.last_seen>86400;return '<tr><td class="mono">'+esc(c.device)+'</td><td class="mono">'+esc(c.user)+'</td><td>'+ago(c.last_seen)+(stale?' <span class="chip off">قدیمی</span>':'')+'</td><td>'+(c.pending?'<span class="chip off">'+c.pending+'</span>':'<span class="chip ok">0</span>')+'</td><td>'+(c.conflicts?'<span class="chip off">'+c.conflicts+'</span>':'<span class="chip ok">0</span>')+'</td><td class="muted" style="font-size:11.5px">'+esc((c.ua||'').slice(0,60))+'</td></tr>'}).join('')||'<tr><td colspan="6" class="muted">هنوز دستگاهی گزارش نداده است.</td></tr>')+'</tbody></table></div></div>'})},
audit:function(){return api('GET','/audit?limit=150').then(function(r){var ac=Array.from(new Set(r.items.map(function(x){return x.action})));return '<div class="card sec"><h2>رویدادها (ممیزی)</h2><div class="row" style="margin-bottom:8px"><select id="af" aria-label="فیلتر"><option value="">همه‌ی رویدادها</option>'+ac.map(function(a){return '<option>'+esc(a)+'</option>'}).join('')+'</select></div><div class="tw"><table id="at"><thead><tr><th>زمان</th><th>کاربر</th><th>رویداد</th><th>هدف</th><th>IP</th></tr></thead><tbody>'+r.items.map(function(x){return '<tr data-ac="'+esc(x.action)+'"><td>'+fdt(x.ts)+'</td><td class="mono">'+esc(x.user)+'</td><td><span class="chip '+(x.action==='login-fail'?'off':'')+'">'+esc(x.action)+'</span></td><td class="mono">'+esc(x.target)+'</td><td class="mono">'+esc(x.ip)+'</td></tr>'}).join('')+'</tbody></table></div></div>'})},
connect:function(){return api('GET','/sites').then(function(r){SITES=r.sites;return '<div class="card sec"><h2>اتصال سایت‌ها (کلید اتصال)</h2><p class="muted" style="margin-top:0;font-size:12.5px;line-height:1.9">برای وصل‌کردن یک سایت یا سرویس (مثل Aide) به هاب، برایش «کلید اتصال» بسازید. کلید فقط به همان سایت دسترسی دارد و با غیرفعال‌کردن حسابش (برگه‌ی کاربران) فوراً باطل می‌شود. هر سایت می‌تواند به‌جای کلید، با کد و رمز کاربران خودش هم وارد شود.</p><form class="form" id="fk"><label>سایت<select name="site">'+r.sites.map(function(s){return '<option value="'+esc(s.slug)+'">'+esc(s.title)+' ('+esc(s.slug)+')</option>'}).join('')+'</select></label><label>برچسب<input name="label" placeholder="مثلاً سرور تقویم"></label><button class="btn">ساخت کلید اتصال</button></form></div>'
 +'<div class="card sec"><h2>هوش مصنوعی محلی</h2><p class="muted" style="margin-top:0;font-size:12.5px;line-height:1.9">درگاه هوش مصنوعی همین هاب است (/api/v1/ai) و فقط به مدل نصب‌شده روی همین سرور وصل می‌شود؛ هیچ درخواستی به بیرون نمی‌رود. اگر خالی بماند یعنی هنوز مدل نصب نشده و دستیار سایت‌ها از همان قواعد داخلی استفاده می‌کند. راهنمای نصب در docs/HOSTING-fa.md است.</p><form class="form" id="fa"><label>پرسش آزمایشی<input name="prompt" value="یک جمله درباره‌ی اهمیت صورتجلسه بنویس."></label><button class="btn">آزمایش</button></form><div id="ao" class="secret hide" style="direction:rtl;text-align:start"></div></div>'})},
backup:function(){return api('GET','/stats').then(function(s){return '<div class="card sec"><h2>پشتیبان و خروجی</h2><p class="muted" style="margin-top:0;font-size:12.5px;line-height:1.9">همه‌ی داده‌ها فقط روی سرور هستند، پس پشتیبان مهم‌ترین مسئولیت است. پشتیبان خودکار روزانه با زمان‌بند سرور (docs/HOSTING-fa.md) انجام می‌شود؛ ۳۰ نسخه‌ی آخر نگه داشته می‌شود. نسخه‌ی خارج از سرور را هفته‌ای یک‌بار دانلود کنید.</p><div class="row"><span class="chip '+(s.last_backup?'ok':'off')+'">آخرین پشتیبان سرور: '+ago(s.last_backup)+'</span></div><div class="row" style="margin-top:12px"><button class="btn" data-a="backup-now">پشتیبان‌گیری همین حالا</button><button class="btn lt" data-a="export">دانلود خروجی کامل (JSON)</button></div><p class="muted" style="font-size:12px">خروجی شامل رمزها نیست (فقط هش داخل پایگاه‌داده می‌ماند و خارج نمی‌شود). فایل خروجی محتوای محرمانه‌ی سایت‌هاست؛ امن نگه دارید.</p></div>'})}
};
document.addEventListener('submit',function(e){var f=e.target;if(!f.id)return;e.preventDefault();var d=new FormData(f);
