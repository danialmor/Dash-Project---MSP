<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>آید · اتصال تقویم به سیستم</title>
<style>
:root{--bg:#f1f4ef;--card:rgba(255,255,255,.78);--ink:#14232a;--ink2:#566a70;--line:rgba(20,35,42,.12);--pri:#14323a;--ok:#1f8a5b;--warn:#c98a10;--bad:#c23a3a;--lime:#8fbf1f;--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(55% 45% at 90% 0,rgba(166,214,58,.25),transparent 70%),radial-gradient(50% 40% at 0 100%,rgba(47,183,166,.18),transparent 70%),var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}.hide{display:none!important}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(20,35,42,.07)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}header b{font-size:17px}.sp{flex:1}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;background:rgba(20,35,42,.08);font-size:12px}.chip.ok{background:rgba(31,138,91,.14);color:var(--ok)}.chip.off{background:rgba(194,58,58,.13);color:var(--bad)}.chip.warn{background:rgba(201,138,16,.16);color:#8a5d00}
input,select{border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:12px;padding:9px 12px;min-height:40px;width:100%}label{display:grid;gap:5px;font-size:12.5px;color:var(--ink2)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:9px 16px;min-height:40px;cursor:pointer;font-weight:600}.btn.lt{background:rgba(20,35,42,.08);color:var(--ink)}.btn.sm{min-height:32px;padding:5px 11px;font-size:12.5px}
.login{display:grid;place-items:center;min-height:70vh;padding:20px}.login form{width:min(380px,100%);padding:24px;display:grid;gap:12px}.login h1{margin:0;font-size:19px}.login p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.9}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
.wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;padding:0 20px 30px}@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.pane{padding:16px}.pane h2{margin:0 0 10px;font-size:15px}
.u{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}.u b.c{font-family:ui-monospace,Menlo,monospace;background:rgba(20,35,42,.08);border-radius:8px;padding:1px 8px}
.ev{display:grid;gap:3px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.65);margin-bottom:8px}.ev.pend{border-style:dashed;border-color:var(--warn)}.ev.conf{border-color:var(--bad);background:rgba(194,58,58,.07)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert{padding:10px 14px;border-radius:12px;margin-bottom:10px;font-size:13px}.alert.warn{background:rgba(201,138,16,.15)}.alert.bad{background:rgba(194,58,58,.12)}
.att{display:flex;gap:6px;flex-wrap:wrap}.att label{display:flex;flex-direction:row;align-items:center;gap:5px;background:rgba(20,35,42,.06);padding:5px 10px;border-radius:99px;color:var(--ink)}.att input{width:auto;min-height:0}
.mono{font-family:ui-monospace,Menlo,monospace}.muted{color:var(--ink2)}
</style>
</head>
<body>
<section id="login" class="login"><form class="card" id="lf"><h1>آید · اتصال تقویم</h1><p>این صفحه نقطه‌ی اتصال تقویم منشی به سیستم مرکزی است. با کد و رمز خودتان وارد شوید تا کاربران و جلسات را ببینید.</p>
<label>کد کاربری<input id="lc" autocapitalize="off" autocomplete="username" required></label><label>رمز<input id="lp" type="password" autocomplete="current-password" required></label><div class="err" id="le" role="alert"></div><button class="btn">ورود</button></form></section>
<div id="app" class="hide">
<header><b>آید · تقویم متصل به سیستم</b><span id="who" class="muted"></span><span class="sp"></span><span id="st" class="chip"></span><button class="btn lt sm" id="out">خروج</button></header>
<div id="alerts" style="padding:0 20px"></div>
<div class="wrap">
 <aside class="card pane"><h2>کاربران و کدهایشان</h2><div id="dir" class="muted">…</div></aside>
 <section class="card pane"><h2>جلسه‌ها</h2>
  <form class="form" id="ef"><label>عنوان<input name="title" required></label><label>شروع<input name="start" type="datetime-local" required></label><label>پایان<input name="end" type="datetime-local" required></label>
   <label style="grid-column:1/-1">شرکت‌کنندگان<div class="att" id="att"></div></label><button class="btn">ثبت جلسه</button></form>
  <div id="evs"></div></section>
</div></div>
<script src="../shared/sdk.js"></script>
<script>
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var H=new HubSDK({site:'aide'}),USERS=[];
var fd=function(s){try{return new Date(s).toLocaleString('fa-IR-u-ca-persian',{weekday:'short',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return s}};
function status(){var s=H.status(),n=$('#st');if(!n)return;n.className='chip '+(!s.online?'off':s.conflicts?'off':s.pending?'warn':'ok');n.textContent=!s.online?'آفلاین · '+s.pending+' تغییر در صف (با اتصال خودکار منتقل می‌شود)':s.conflicts?s.conflicts+' تعارض نیاز به تصمیم':s.pending?s.pending+' تغییر در حال ارسال':'آنلاین · همه‌چیز روی سرور ذخیره است';render()}
H.on('status',status);setInterval(status,1500);
function alertBox(cls,t){var d=document.createElement('div');d.className='alert '+cls;d.setAttribute('role','status');d.textContent=t;$('#alerts').appendChild(d);setTimeout(function(){d.remove()},9000)}
H.on('warning',function(w){w.warnings.forEach(function(x){alertBox('warn','هم‌پوشانی: «'+x.title+'» برای '+x.codes.join('، ')+' در همین ساعت‌ها هم ثبت شده است.')})});
$('#lf').addEventListener('submit',function(e){e.preventDefault();$('#le').textContent='';H.login($('#lc').value.trim(),$('#lp').value).then(enter,function(x){$('#le').textContent=x.status===429?'تلاش‌های ناموفق زیاد بود.':x.status===403?'اجازه‌ی این سایت را ندارید.':x.offline?'اتصال برقرار نیست.':'کد یا رمز درست نیست.'})});
$('#out').addEventListener('click',function(){H.logout().then(function(){location.reload()},function(){if(confirm('تغییرات ارسال‌نشده هنوز روی این دستگاه است و با خروج از بین می‌رود. خروج؟'))H.logout(true).then(function(){location.reload()})})});
H.on('auth',function(){location.reload()});
H.me().then(function(){enter()},function(){});
function enter(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=H.user.name+' · '+H.user.code;
 H.directory().then(function(u){USERS=u;$('#dir').innerHTML=u.map(function(x){return '<div class="u"><span>'+esc(x.name)+'<br><small class="muted">'+esc(x.role)+'</small></span><b class="c">'+esc(x.code)+'</b></div>'}).join('');$('#att').innerHTML=u.map(function(x){return '<label><input type="checkbox" value="'+esc(x.code)+'">'+esc(x.name)+' ('+esc(x.code)+')</label>'}).join('')});
 H.list('events').then(render);H.watch('events',render,5000)}
function render(){if(!H.token)return;var v=H.view('events').sort(function(a,b){return String(a.data.start).localeCompare(String(b.data.start))}),h=H.conflicts();
 var cb=h.map(function(o){return '<div class="alert bad">تعارض در «'+esc((o.data||{}).title||o.id)+'»: کس دیگری همین جلسه را تغییر داده ('+esc(o.server&&o.server.data?o.server.data.title:'حذف‌شده')+'). <button class="btn sm" data-r="mine" data-o="'+o.op_id+'">تغییر من بماند</button> <button class="btn lt sm" data-r="theirs" data-o="'+o.op_id+'">نسخه‌ی سرور بماند</button></div>'}).join('');
 $('#evs').innerHTML=cb+(v.length?v.map(function(e){var d=e.data||{};return '<div class="ev '+(e.conflict?'conf':e.pending?'pend':'')+'"><b>'+esc(d.title)+'</b><span class="muted">'+fd(d.start)+' ← '+fd(d.end)+'</span><span>'+(d.attendees||[]).map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join('')+(e.pending?' <span class="chip warn">در صف ارسال</span>':'')+'</span><div class="row"><button class="btn lt sm" data-del="'+esc(e.id)+'">حذف</button></div></div>'}).join(''):'<div class="muted">جلسه‌ای ثبت نشده است.</div>')}
$('#ef').addEventListener('submit',function(e){e.preventDefault();var d=new FormData(e.target),a=[].map.call(document.querySelectorAll('#att input:checked'),function(x){return x.value});if(d.get('end')<=d.get('start')){alertBox('bad','زمان پایان باید بعد از شروع باشد.');return}
 H.put('events','ev-'+Date.now().toString(36),{title:d.get('title'),start:d.get('start'),end:d.get('end'),attendees:a,type:'meeting',by:H.user.code}).then(function(){e.target.reset()})});
document.addEventListener('click',function(e){var r=e.target.closest('[data-r]'),x=e.target.closest('[data-del]');if(r)H.resolve(r.dataset.o,r.dataset.r).then(render);if(x&&confirm('این جلسه حذف شود؟'))H.remove('events',x.dataset.del).then(render)});
</script>
</body>
</html>
